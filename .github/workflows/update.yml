name: Weekly NFL update

on:
  schedule:
    - cron: '0 */12 * * *'    # every 12 hours (00:00 and 12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python site_data.py
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
      - name: Save the updated page
        run: |
          git config user.name  "nfl-bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add index.html line_history.json
          git commit -m "Auto update" || echo "No changes this run"
          git push
